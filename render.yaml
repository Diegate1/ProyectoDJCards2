services:
  # PostgreSQL Database (Render Managed)
  - type: pserv
    name: pokemontcg-db
    ipAddress: 127.0.0.1
    databaseName: pokemontcg
    user: postgres
    plan: free
    region: oregon

  # Backend Service (NestJS)
  - type: web
    name: pokemontcg-backend
    runtime: docker
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: pokemontcg-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://pokemontcg-frontend.onrender.com
      - key: API_BASE_URL
        value: https://pokemontcg-backend.onrender.com
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployOnPush: true

  # Frontend Service (React/Vite)
  - type: web
    name: pokemontcg-frontend
    runtime: docker
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://pokemontcg-backend.onrender.com
    plan: free
    region: oregon
    healthCheckPath: /index.html
    autoDeployOnPush: true
    routes:
      - path: /
        rewrite: /index.html
